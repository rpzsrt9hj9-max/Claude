<title>2048</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column — header with scores, toolbar, square board with sliding tiles. Tile hue shifts from cool blue (2) to hot red (2048+). */
:root {
  --bg: #eef1f5;
  --fg: #1d2530;
  --muted: #667085;
  --panel: #dde3ec;
  --cell: #cdd5e1;
  --btn: #1d2530;
  --btn-fg: #f4f6fa;
  --btn-ghost: #d3dae6;
  --overlay: rgba(238, 241, 245, 0.82);
  --l0: 90%;
  --ld: -3.6%;
  --lmin: 46%;
  --lmax: 92%;
  --sat: 78%;
  --txt-lo: #1f3350;
  --txt-hi: #ffffff;
  --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --fg: #e8ecf3; --muted: #8b95a7; --panel: #1b212c; --cell: #262e3b;
    --btn: #e8ecf3; --btn-fg: #11151c; --btn-ghost: #2a3342; --overlay: rgba(17, 21, 28, 0.82);
    --l0: 24%; --ld: 3.4%; --lmin: 20%; --lmax: 58%; --sat: 62%;
    --txt-lo: #e8ecf3; --txt-hi: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --fg: #e8ecf3; --muted: #8b95a7; --panel: #1b212c; --cell: #262e3b;
  --btn: #e8ecf3; --btn-fg: #11151c; --btn-ghost: #2a3342; --overlay: rgba(17, 21, 28, 0.82);
  --l0: 24%; --ld: 3.4%; --lmin: 20%; --lmax: 58%; --sat: 62%;
  --txt-lo: #e8ecf3; --txt-hi: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center;
  overscroll-behavior: contain;
}
.app { width: min(100%, 460px); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
header { display: flex; align-items: stretch; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; margin: 0; letter-spacing: -0.03em; align-self: center; }
.scores { display: flex; gap: 8px; }
.score { background: var(--panel); border-radius: 10px; padding: 8px 14px; min-width: 84px; text-align: center; position: relative; }
.score small { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.score b { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.gain { position: absolute; left: 0; right: 0; top: 4px; font-weight: 700; color: var(--fg); pointer-events: none; opacity: 0; font-variant-numeric: tabular-nums; }
.gain.show { animation: gain 0.7s ease-out; }
@keyframes gain { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-28px); } }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bar p { margin: 0; color: var(--muted); font-size: 14px; flex: 1 1 180px; min-width: 0; }
button {
  font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 10px; padding: 10px 14px;
  background: var(--btn); color: var(--btn-fg); cursor: pointer; font-variant-numeric: tabular-nums;
}
button.ghost { background: var(--btn-ghost); color: var(--fg); }
button:disabled { opacity: 0.4; cursor: default; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.board {
  position: relative; width: 100%; aspect-ratio: 1; background: var(--panel); border-radius: 14px;
  container-type: inline-size; touch-action: none; user-select: none; -webkit-user-select: none;
}
.cell, .tile { position: absolute; width: 21.875%; height: 21.875%; border-radius: 8px; }
.cell { background: var(--cell); }
.tile {
  --n: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 800; font-size: 9.5cqw; font-variant-numeric: tabular-nums;
  --tl: clamp(var(--lmin), calc(var(--l0) + var(--n) * var(--ld)), var(--lmax));
  background: hsl(calc(212 - var(--n) * 21) var(--sat) var(--tl));
  color: var(--txt-hi);
  transition: left 0.11s ease-out, top 0.11s ease-out;
  will-change: left, top;
}
.tile.lo { color: var(--txt-lo); }
.tile.d4 { font-size: 7.6cqw; }
.tile.d5 { font-size: 6cqw; }
.tile.hot { box-shadow: 0 0 0 2px hsl(calc(212 - var(--n) * 21) 90% 70% / 0.6), 0 0 22px hsl(calc(212 - var(--n) * 21) 90% 55% / 0.55); }
.tile.new { animation: pop 0.18s ease-out 0.1s backwards; }
.tile.merged { animation: bump 0.18s ease-out 0.1s; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes bump { 50% { transform: scale(1.14); } }
.overlay {
  position: absolute; inset: 0; border-radius: 14px; background: var(--overlay); backdrop-filter: blur(3px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; z-index: 5;
}
.overlay h2 { font-family: var(--font-display); font-size: 40px; margin: 0; letter-spacing: -0.02em; }
.overlay div { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
footer { color: var(--muted); font-size: 13px; }
@media (max-width: 420px) { h1 { font-size: 44px; } .score { min-width: 74px; padding: 8px 10px; } }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile.new, .tile.merged, .gain.show { animation: none; } }
</style>

<div class="app">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><small>Score</small><b id="score">0</b><span class="gain" id="gain"></span></div>
      <div class="score"><small>Meilleur</small><b id="best">0</b></div>
    </div>
  </header>
  <div class="bar">
    <p>Fusionnez les tuiles identiques pour atteindre 2048.</p>
    <button id="undo" class="ghost" title="Annuler (U, Retour arrière ou Ctrl+Z)">↶ Retour <span id="moves">0</span></button>
    <button id="restart">Nouvelle partie</button>
    <button id="theme" class="ghost" aria-label="Changer de thème">◐</button>
  </div>
  <div class="board" id="board" tabindex="0" aria-label="Plateau de jeu">
    <div id="overlay" class="overlay" hidden></div>
  </div>
  <footer>Flèches, WASD ou glissement du doigt. <b>U</b>, Retour arrière ou Ctrl+Z pour revenir en arrière, sans limite.</footer>
</div>

<script>
(function () {
  var N = 4, boardEl = document.getElementById('board');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var gainEl = document.getElementById('gain'), undoBtn = document.getElementById('undo');
  var movesEl = document.getElementById('moves'), overlay = document.getElementById('overlay');
  var grid, score, best = 0, history, nextId, els = {}, won, keepGoing, over;

  try { best = +localStorage.getItem('best2048') || 0; } catch (e) {}
  bestEl.textContent = best;

  for (var i = 0; i < N * N; i++) {
    var c = document.createElement('div'); c.className = 'cell';
    setPos(c, Math.floor(i / N), i % N); boardEl.insertBefore(c, overlay);
  }
  function pos(k) { return 2.5 + k * 24.375; }
  function setPos(el, r, c) { el.style.top = pos(r) + '%'; el.style.left = pos(c) + '%'; }

  function empty() { return Array.from({ length: N }, function () { return Array(N).fill(null); }); }
  function snapshot() { return { s: score, g: grid.map(function (row) { return row.map(function (t) { return t ? t.v : 0; }); }) }; }

  function newGame() {
    Object.keys(els).forEach(function (k) { els[k].remove(); }); els = {};
    grid = empty(); score = 0; history = []; nextId = 1; won = false; keepGoing = false; over = false;
    spawn(); spawn(); hideOverlay(); update();
  }

  function spawn() {
    var free = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!grid[r][c]) free.push([r, c]);
    if (!free.length) return;
    var p = free[Math.floor(Math.random() * free.length)];
    var t = { id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r: p[0], c: p[1] };
    grid[p[0]][p[1]] = t; draw(t, 'new');
  }

  function draw(t, anim) {
    var el = els[t.id];
    if (!el) { el = els[t.id] = document.createElement('div'); boardEl.insertBefore(el, overlay); setPos(el, t.r, t.c); }
    var n = Math.log2(t.v), d = String(t.v).length;
    el.className = 'tile' + (n <= 2 ? ' lo' : '') + (d === 4 ? ' d4' : d > 4 ? ' d5' : '') + (t.v >= 2048 ? ' hot' : '');
    el.style.setProperty('--n', n); el.textContent = t.v; setPos(el, t.r, t.c);
    if (anim) { void el.offsetWidth; el.classList.add(anim); }
  }

  // dir: 0 gauche, 1 haut, 2 droite, 3 bas
  function move(dir) {
    if (over) return;
    var before = snapshot(), gained = 0, moved = false, removed = [];
    for (var i = 0; i < N; i++) {
      var line = [];
      for (var j = 0; j < N; j++) {
        var r = dir % 2 ? (dir === 1 ? j : N - 1 - j) : i, c = dir % 2 ? i : (dir === 0 ? j : N - 1 - j);
        line.push([r, c]);
      }
      var tiles = line.map(function (p) { return grid[p[0]][p[1]]; }).filter(Boolean), out = [], k = 0;
      while (k < tiles.length) {
        var a = tiles[k], b = tiles[k + 1];
        if (b && a.v === b.v) {
          a.v *= 2; gained += a.v; a.merged = true; b.into = a; removed.push(b); out.push(a); k += 2;
        } else { out.push(a); k++; }
      }
      line.forEach(function (p) { grid[p[0]][p[1]] = null; });
      out.forEach(function (t, idx) {
        var p = line[idx];
        if (t.r !== p[0] || t.c !== p[1]) moved = true;
        t.r = p[0]; t.c = p[1]; grid[p[0]][p[1]] = t;
      });
    }
    if (removed.length) moved = true;
    if (!moved) return;
    history.push(before); score += gained;
    removed.forEach(function (b) {
      b.r = b.into.r; b.c = b.into.c; setPos(els[b.id], b.r, b.c);
      var el = els[b.id]; delete els[b.id]; setTimeout(function () { el.remove(); }, 130);
    });
    for (var r2 = 0; r2 < N; r2++) for (var c2 = 0; c2 < N; c2++) {
      var t = grid[r2][c2]; if (t) { draw(t, t.merged ? 'merged' : ''); t.merged = false; }
    }
    spawn();
    if (gained) { gainEl.textContent = '+' + gained; gainEl.classList.remove('show'); void gainEl.offsetWidth; gainEl.classList.add('show'); }
    update(); checkEnd();
  }

  function canMove() {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var t = grid[r][c]; if (!t) return true;
      if (c + 1 < N && grid[r][c + 1].v === t.v) return true;
      if (r + 1 < N && grid[r + 1][c].v === t.v) return true;
    }
    return false;
  }

  function checkEnd() {
    if (!won && !keepGoing && grid.some(function (row) { return row.some(function (t) { return t && t.v >= 2048; }); })) {
      won = true; showOverlay('Vous avez gagné !', [['Continuer', function () { keepGoing = true; hideOverlay(); }], ['Rejouer', newGame]]);
    } else if (!canMove()) {
      over = true; showOverlay('Partie terminée', [['↶ Revenir en arrière', undo], ['Rejouer', newGame]]);
    }
  }

  function undo() {
    if (!history.length) return;
    var s = history.pop();
    Object.keys(els).forEach(function (k) { els[k].remove(); }); els = {};
    grid = empty(); score = s.s; over = false; hideOverlay();
    s.g.forEach(function (row, r) { row.forEach(function (v, c) {
      if (v) { var t = { id: nextId++, v: v, r: r, c: c }; grid[r][c] = t; draw(t, ''); }
    }); });
    update();
  }

  function showOverlay(title, btns) {
    overlay.innerHTML = ''; var h = document.createElement('h2'); h.textContent = title; overlay.appendChild(h);
    var d = document.createElement('div');
    btns.forEach(function (b, i) { var x = document.createElement('button'); x.textContent = b[0]; if (i) x.className = 'ghost'; x.onclick = b[1]; d.appendChild(x); });
    overlay.appendChild(d); overlay.hidden = false;
  }
  function hideOverlay() { overlay.hidden = true; }

  function update() {
    scoreEl.textContent = score;
    if (score > best) { best = score; try { localStorage.setItem('best2048', best); } catch (e) {} }
    bestEl.textContent = best; movesEl.textContent = history.length; undoBtn.disabled = !history.length;
  }

  var keys = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3, a: 0, w: 1, d: 2, s: 3 };
  document.addEventListener('keydown', function (e) {
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (((e.ctrlKey || e.metaKey) && k === 'z') || k === 'u' || k === 'Backspace') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k in keys) { e.preventDefault(); move(keys[k]); }
  });

  var sx, sy;
  boardEl.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });
  boardEl.addEventListener('pointerup', function (e) {
    if (sx == null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 0) : (dy > 0 ? 3 : 1));
  });

  undoBtn.onclick = undo;
  document.getElementById('restart').onclick = newGame;
  document.getElementById('theme').onclick = function () {
    var root = document.documentElement, cur = root.getAttribute('data-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme2048', next); } catch (e) {}
  };
  try { var th = localStorage.getItem('theme2048'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}

  newGame();
})();
</script>

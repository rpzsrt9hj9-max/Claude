<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notes">
<title>Notes horodatées</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="btn-back" class="icon-btn hidden" type="button" aria-label="Retour">←</button>
  <h1 id="view-title">Notes</h1>
  <div id="topbar-actions" class="topbar-actions"></div>
</header>

<main id="main"></main>

<div id="composer" class="composer hidden">
  <div class="composer-meta">
    <span id="composer-clock" class="composer-clock"></span>
    <span class="composer-hint">chaque entrée est horodatée</span>
  </div>
  <div class="composer-row">
    <button id="composer-todo-toggle" class="composer-toggle" type="button" aria-label="Mode case à cocher" title="Case à cocher">☑</button>
    <textarea id="composer-input" class="composer-input" rows="1" placeholder="Dépose une idée…"></textarea>
    <button id="composer-send" class="composer-send" type="button" aria-label="Ajouter">➤</button>
  </div>
</div>

<nav id="tabbar" class="tabbar">
  <button class="tab-btn active" data-tab="notes" type="button"><span class="tab-icon">📝</span><span>Notes</span></button>
  <button class="tab-btn" data-tab="todos" type="button"><span class="tab-icon">✅</span><span>À faire</span></button>
  <button class="tab-btn" data-tab="journal" type="button"><span class="tab-icon">🕒</span><span>Journal</span></button>
  <button class="tab-btn" data-tab="docs" type="button"><span class="tab-icon">📂</span><span>Docs</span></button>
</nav>

<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
